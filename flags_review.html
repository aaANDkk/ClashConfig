    <style>
        :root {
            --bg-color: #1a1a1a;
            --card-bg: #262626;
            --text-color: #eaeaea;
            --text-muted: #999;
            --border-color: #383838;
            --accent-color: #007aff;
            --accent-hover: #0056b3;
            --flag-bg: #2a2a2a;
        }

        body[data-theme="light"] {
            --bg-color: #f2f3f5;
            --card-bg: #ffffff;
            --text-color: #222222;
            --text-muted: #666666;
            --border-color: #e0e0e0;
            --flag-bg: #f8f9fa;
        }

        body[data-theme="white"] {
            --bg-color: #ffffff;
            --card-bg: #ffffff;
            --text-color: #111111;
            --text-muted: #777777;
            --border-color: #eeeeee;
            --flag-bg: #ffffff;
        }

        body[data-theme="black"] {
            --bg-color: #0d0d0d;
            --card-bg: #141414;
            --text-color: #f0f0f0;
            --text-muted: #888888;
            --border-color: #262626;
            --flag-bg: #000000;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            transition: background-color 0.2s, color 0.2s;
            padding-bottom: 60px;
        }

        header {
            position: sticky;
            top: 0;
            z-index: 100;
            background: var(--card-bg);
            border-bottom: 1px solid var(--border-color);
            padding: 14px 24px;
            box-shadow: 0 4px 16px rgba(0,0,0,0.15);
        }

        .header-top {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 12px;
            flex-wrap: wrap;
            gap: 12px;
        }

        .title-group h1 {
            font-size: 20px;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .badge {
            font-size: 12px;
            padding: 2px 8px;
            background: var(--accent-color);
            color: #fff;
            border-radius: 12px;
            font-weight: normal;
        }

        .controls {
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }

        .btn-group {
            display: flex;
            background: var(--bg-color);
            border-radius: 8px;
            border: 1px solid var(--border-color);
            overflow: hidden;
        }

        .btn-group button {
            background: transparent;
            border: none;
            padding: 6px 12px;
            font-size: 13px;
            color: var(--text-color);
            cursor: pointer;
            transition: background 0.15s;
        }

        .btn-group button.active {
            background: var(--accent-color);
            color: #fff;
        }

        .filter-bar {
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }

        .search-box {
            position: relative;
            flex: 1;
            min-width: 240px;
        }

        .search-box input {
            width: 100%;
            padding: 8px 14px 8px 36px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            background: var(--bg-color);
            color: var(--text-color);
            font-size: 14px;
            outline: none;
        }

        .search-box svg {
            position: absolute;
            left: 10px;
            top: 50%;
            transform: translateY(-50%);
            width: 16px;
            height: 16px;
            fill: var(--text-muted);
        }

        .slider-group {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 13px;
            color: var(--text-muted);
        }

        .slider-group input[type="range"] {
            width: 100px;
            cursor: pointer;
        }

        /* Flag Stage Backgrounds */
        .stage-checker {
            background-image: linear-gradient(45deg, #333 25%, transparent 25%), 
                              linear-gradient(-45deg, #333 25%, transparent 25%), 
                              linear-gradient(45deg, transparent 75%, #333 75%), 
                              linear-gradient(-45deg, transparent 75%, #333 75%);
            background-size: 16px 16px;
            background-position: 0 0, 0 8px, 8px -8px, -8px 0px;
            background-color: #222;
        }

        body[data-theme="light"] .stage-checker {
            background-image: linear-gradient(45deg, #e0e0e0 25%, transparent 25%), 
                              linear-gradient(-45deg, #e0e0e0 25%, transparent 25%), 
                              linear-gradient(45deg, transparent 75%, #e0e0e0 75%), 
                              linear-gradient(-45deg, transparent 75%, #e0e0e0 75%);
            background-color: #f5f5f5;
        }

        /* Grid */
        .grid-container {
            padding: 24px;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(var(--card-size, 140px), 1fr));
            gap: 16px;
        }

        .flag-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
            cursor: pointer;
            transition: transform 0.15s, box-shadow 0.15s, border-color 0.15s;
            position: relative;
        }

        .flag-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 24px rgba(0,0,0,0.25);
            border-color: var(--accent-color);
        }

        .img-wrap {
            width: 100%;
            aspect-ratio: 1 / 1;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 8px;
            background: var(--flag-bg);
            overflow: hidden;
            margin-bottom: 8px;
            position: relative;
        }

        .img-wrap img {
            width: 82%;
            height: 82%;
            object-fit: contain;
            display: block;
            pointer-events: none;
            filter: drop-shadow(0 2px 5px rgba(0,0,0,0.12));
        }

        .card-info {
            text-align: center;
            width: 100%;
        }

        .flag-title {
            font-size: 13px;
            font-weight: 600;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .flag-name {
            font-size: 11px;
            color: var(--text-muted);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            margin-top: 2px;
        }

        .flag-meta {
            font-size: 10px;
            color: var(--text-muted);
            margin-top: 4px;
            display: flex;
            justify-content: center;
            gap: 6px;
        }

        /* Modal */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.75);
            backdrop-filter: blur(8px);
            z-index: 999;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .modal-overlay.active {
            display: flex;
        }

        .modal-content {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            width: 100%;
            max-width: 680px;
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            position: relative;
            box-shadow: 0 16px 40px rgba(0,0,0,0.5);
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .modal-title h2 {
            font-size: 18px;
            font-weight: 700;
        }

        .modal-title p {
            font-size: 13px;
            color: var(--text-muted);
        }

        .close-btn {
            background: none;
            border: none;
            font-size: 24px;
            color: var(--text-muted);
            cursor: pointer;
            padding: 4px 8px;
        }

        .close-btn:hover {
            color: var(--text-color);
        }

        .modal-preview {
            width: 100%;
            height: 380px;
            border-radius: 12px;
            background: var(--flag-bg);
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
            border: 1px solid var(--border-color);
        }

        .modal-preview img {
            width: 300px;
            height: 300px;
            object-fit: contain;
            transition: transform 0.2s;
            filter: drop-shadow(0 4px 16px rgba(0,0,0,0.18));
        }

        .modal-nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .nav-btn {
            background: var(--bg-color);
            border: 1px solid var(--border-color);
            color: var(--text-color);
            padding: 8px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 13px;
        }

        .nav-btn:hover {
            background: var(--accent-color);
            color: #fff;
            border-color: var(--accent-color);
        }

        .modal-details {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            background: var(--bg-color);
            padding: 12px;
            border-radius: 8px;
            font-size: 12px;
        }

        .detail-item span {
            color: var(--text-muted);
            display: block;
            margin-bottom: 2px;
        }

        .detail-item strong {
            font-size: 13px;
        }

        .empty-state {
            grid-column: 1 / -1;
            text-align: center;
            padding: 60px 20px;
            color: var(--text-muted);
        }
    </style>
</head>
<body data-theme="dark">

<header>
    <div class="header-top">

        <div class="controls">

            <div class="btn-group">

                <button onclick="setTheme('light')">浅灰</button>
                <button onclick="setTheme('white')">纯白</button>
                <button onclick="setTheme('black')">纯黑</button>
            </div>

            <!-- 图标舞台背景 -->
            <div class="btn-group">
                <button class="active" onclick="setFlagBg('default')">默认底板</button>
                <button onclick="setFlagBg('checker')">棋盘格透视</button>
                <button onclick="setFlagBg('#ffffff')">白底</button>
                <button onclick="setFlagBg('#000000')">黑底</button>
            </div>
        </div>
    </div>

    <div class="filter-bar">
        <div class="search-box">
            <svg viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
            <input type="text" id="searchInput" placeholder="搜索国旗名称、英文名或拼音 (如: 肯尼亚, Kenya, JP)..." oninput="filterFlags()">
        </div>

        <div class="btn-group">
            <button class="active" onclick="filterCategory('all', this)">全部</button>
            <button onclick="filterCategory('complex', this)">复杂图腾/纹样</button>
            <button onclick="filterCategory('large', this)">体积&gt;8KB</button>
            <button onclick="filterCategory('stroke', this)">含直接描边</button>
        </div>

        <div class="slider-group">
            <span>缩放:</span>
            <input type="range" min="90" max="220" value="130" id="sizeSlider" oninput="changeCardSize(this.value)">
            <span id="sizeVal">130px</span>
        </div>
    </div>
</header>

<main class="grid-container" id="flagGrid">
</main>

<!-- Modal -->
<div class="modal-overlay" id="modalOverlay" onclick="handleOverlayClick(event)">
    <div class="modal-content">
        <div class="modal-header">
            <div class="modal-title">
                <h2 id="modalTitle">国旗详情</h2>
                <p id="modalSub">FileName.svg</p>
            </div>
            <button class="close-btn" onclick="closeModal()">&times;</button>
        </div>

        <div class="modal-preview" id="modalPreview">
            <img id="modalImg" src="" alt="Flag Detail">
        </div>

        <div class="modal-details">
            <div class="detail-item">
                <span>文件体积</span>
                <strong id="modalSize">-</strong>
            </div>
            <div class="detail-item">
                <span>Path 数量</span>
                <strong id="modalPaths">-</strong>
            </div>
            <div class="detail-item">
                <span>直接 Stroke</span>
                <strong id="modalStroke">-</strong>
            </div>
        </div>

        <div class="modal-nav">
            <button class="nav-btn" onclick="prevFlag()">← 上一个 (A / 左键)</button>
            <span style="font-size: 12px; color: var(--text-muted);" id="modalIndex">1 / 270</span>
            <button class="nav-btn" onclick="nextFlag()">下一个 (D / 右键) →</button>
        </div>
    </div>
</div>

let currentCategory = 'all';
let currentTheme = 'dark';
let activeFlagIndex = 0;
let filteredFlags = [...flags];

// Complex totem flag names for one-click filter
const complexTotems = new Set([
    "Kenya", "Belarus", "Turkmenistan", "Kazakhstan", "Belize", "Mexico",
    "Sri_Lanka", "Cambodia", "Bhutan", "Wales", "Uganda", "Eswatini", "Lesotho",
    "Spain", "Portugal", "Andorra", "Moldova", "Ecuador", "Fiji", "Papua_New_Guinea",
    "Dominica", "Albania", "Montenegro", "Serbia", "Guatemala", "Haiti", "Paraguay",
    "Iran", "Vatican_City", "San_Marino", "Bermuda", "Cayman_Islands", "Falkland_Islands",
    "Virgin_Islands_U_S"
]);

function renderFlags() {
    const grid = document.getElementById('flagGrid');
    grid.innerHTML = '';

    if (filteredFlags.length === 0) {
        grid.innerHTML = '<div class="empty-state">没有找到匹配的国旗</div>';
        document.getElementById('flag-count').textContent = '0';
        return;
    }

    document.getElementById('flag-count').textContent = filteredFlags.length;

    filteredFlags.forEach((item, index) => {
        const card = document.createElement('div');
        card.className = 'flag-card';
        card.onclick = () => openModal(index);

        card.innerHTML = `
            <div class="img-wrap">
                <img src="icon/svg/flag/${item.file}" loading="lazy" alt="${item.title}">
            </div>
            <div class="card-info">
                <div class="flag-title" title="${item.title}">${item.title}</div>
                <div class="flag-name" title="${item.name}">${item.name}</div>
                <div class="flag-meta">
                    <span>${(item.size / 1024).toFixed(1)}K</span>
                    <span>•</span>
                    <span>${item.paths}p</span>
                </div>
            </div>
        `;
        grid.appendChild(card);
    });
}

function setTheme(theme) {
    document.body.setAttribute('data-theme', theme);
    document.querySelectorAll('.header-top .btn-group:first-child button').forEach(b => {
        b.classList.toggle('active', b.textContent.includes(
            theme === 'dark' ? '暗黑' : (theme === 'light' ? '浅灰' : (theme === 'white' ? '纯白' : '纯黑'))
        ));
    });
}

function setFlagBg(bg) {
    const wraps = document.querySelectorAll('.img-wrap, .modal-preview');
    wraps.forEach(w => {
        if (bg === 'checker') {
            w.classList.add('stage-checker');
            w.style.backgroundColor = '';
        } else if (bg === 'default') {
            w.classList.remove('stage-checker');
            w.style.backgroundColor = '';
        } else {
            w.classList.remove('stage-checker');
            w.style.backgroundColor = bg;
        }
    });

    document.querySelectorAll('.header-top .btn-group:last-child button').forEach(b => {
        const isTarget = (bg === 'default' && b.textContent.includes('默认')) ||
                         (bg === 'checker' && b.textContent.includes('棋盘格')) ||
                         (bg === '#ffffff' && b.textContent.includes('白底')) ||
                         (bg === '#000000' && b.textContent.includes('黑底'));
        b.classList.toggle('active', isTarget);
    });
}

function changeCardSize(size) {
    document.documentElement.style.setProperty('--card-size', size + 'px');
    document.getElementById('sizeVal').textContent = size + 'px';
}

function filterCategory(cat, btn) {
    currentCategory = cat;
    document.querySelectorAll('.filter-bar .btn-group button').forEach(b => b.classList.remove('active'));
    if (btn) btn.classList.add('active');
    filterFlags();
}

function filterFlags() {
    const q = document.getElementById('searchInput').value.trim().toLowerCase();

    filteredFlags = flags.filter(item => {
        // Category check
        if (currentCategory === 'complex' && !complexTotems.has(item.name)) return false;
        if (currentCategory === 'large' && item.size < 8192) return false;
        if (currentCategory === 'stroke' && !item.has_stroke) return false;

        // Search check
        if (!q) return true;
        return item.name.toLowerCase().includes(q) || item.title.toLowerCase().includes(q);
    });

    renderFlags();
}

function openModal(index) {
    activeFlagIndex = index;
    const item = filteredFlags[index];
    if (!item) return;

    document.getElementById('modalTitle').textContent = item.title;
    document.getElementById('modalSub').textContent = `${item.file} (${item.name})`;
    document.getElementById('modalImg').src = `icon/svg/flag/${item.file}`;
    document.getElementById('modalSize').textContent = `${(item.size / 1024).toFixed(2)} KB (${item.size} B)`;
    document.getElementById('modalPaths').textContent = `${item.paths} 个路径`;
    document.getElementById('modalStroke').textContent = item.has_stroke ? '包含 stroke' : '纯 fill';
    document.getElementById('modalIndex').textContent = `${index + 1} / ${filteredFlags.length}`;

    document.getElementById('modalOverlay').classList.add('active');
}

function closeModal() {
    document.getElementById('modalOverlay').classList.remove('active');
}

function prevFlag() {
    if (filteredFlags.length === 0) return;
    activeFlagIndex = (activeFlagIndex - 1 + filteredFlags.length) % filteredFlags.length;
    openModal(activeFlagIndex);
}

function nextFlag() {
    if (filteredFlags.length === 0) return;
    activeFlagIndex = (activeFlagIndex + 1) % filteredFlags.length;
    openModal(activeFlagIndex);
}

function handleOverlayClick(e) {
    if (e.target.id === 'modalOverlay') closeModal();
}

// Keyboard shortcuts
window.addEventListener('keydown', (e) => {
    if (document.getElementById('modalOverlay').classList.contains('active')) {
        if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') prevFlag();
        if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') nextFlag();
        if (e.key === 'Escape') closeModal();
    }
});

// Init
changeCardSize(130);
renderFlags();
