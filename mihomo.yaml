# ─── 🪝 锚点定义区域 START ───

# 🩺 订阅源健康统一检查参数
airport: &airport
  type: http
  interval: 86400
  health-check:
    enable: true
    lazy: true
    interval: 10800
    timeout: 5000
    url: "http://g.cn/generate_204"     
           
# 🚀 自动选择策略统一延迟测试
auto: &auto
  lazy: true
  hidden: true
  interval: 1800
  timeout: 5000
  tolerance: 80
  type: url-test
  exclude-type: 'Hysteria2|Direct' # 排除 Hy2 和 Direct 节点
  exclude-filter: '(?i)备用|下载|低倍|(?<!\d)0\.[0-5]' # 排除备用和低倍率节点
  url: "http://g.cn/generate_204"
  icon: "https://fastly.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Auto.png"

# 👋 手动选择策略统一特性
manual: &manual { include-all: true, type: select, exclude-type: Direct }

# 📌 策略组统一可选节点
group: &group {type: select, proxies: [Default, Direct, All Proxies, Residential, Hong Kong, Taiwan, Japan, Singapore, United States, Other Regions]}

# 🧠 DNS 统一锚点
chinaDNS: &chinaDNS
  - 'https://dns.alidns.com/dns-query#DIRECT'
  - 'https://doh.pub/dns-query#DIRECT'
foreignDNS: &foreignDNS
  - 'https://dns.cloudflare.com/dns-query#Default'
  - 'https://dns.google/dns-query#Default'

# 🚫 订阅源统一过滤节点（用于从源头过滤官网、流量等信息）
global_exclude_filter: &global_exclude_filter { exclude-filter: '群|返利|循环|网址|获取|下次|官址|过期|已用|联系|邮箱|工单|贩卖|通知|倒卖|防止|国内|地址|频道|无法|说明|提示|访问|支持|教程|关注|更新|作者|加入|超时|收藏|福利|邀请|好友|失联|选择|公益|发布|DIZTNA|通路|登录|定时|渠道|牢记|永久|余额|阁下|本站|刷新|导航|建议|以下|⚠️|@|expire|http|com|traffic|网站|官网|Web|重置|到期|剩余|流量|机场|客服|套餐|订阅|版本' }

# 🧭 地区分组统一过滤器
group_filter:
  filter_Home: &filter_Home
    filter: '(?i)(🏠|家庭|家宽|住宅|HOME|HINET|HKT|PCCW|Netvigator|HKBN|HGC|AT&T|Comcast|Xfinity|Spectrum|Cox|Verizon|Optimum|Frontier|CenturyLink|Quantum|Google\s*Fiber|Starlink|So-net|Seednet|BIGLOBE|OCN|J:COM|SK\s*Broadband|play)'
  filter_HK: &filter_HK
    filter: '(?i)(🇭🇰|香港|(?<![A-Za-z])HKG?(?![A-Za-z])|hong\s*kong)'
  filter_TW: &filter_TW
    filter: '(?i)(🇹🇼|台湾|(?<![A-Za-z])TWN?(?![A-Za-z])|taiwan)'
  filter_JP: &filter_JP
    filter: '(?i)(🇯🇵|日本|(?<![A-Za-z])JPN?(?![A-Za-z])|japan)'
  filter_SG: &filter_SG
    filter: '(?i)(🇸🇬|新加坡|狮城|(?<![A-Za-z])SGP?(?![A-Za-z])|singapore)'
  filter_US: &filter_US
    filter: '(?i)(🇺🇸|美国|(?<![A-Za-z])USA?(?![A-Za-z])|america|united\s*states)'
  filter_Others: &filter_Others
    filter: '^(?!.*(?i)(🇭🇰|香港|(?<![A-Za-z])HKG?(?![A-Za-z])|hong\s*kong|🇹🇼|台湾|(?<![A-Za-z])TWN?(?![A-Za-z])|taiwan|🇯🇵|日本|(?<![A-Za-z])JPN?(?![A-Za-z])|japan|🇸🇬|新加坡|狮城|(?<![A-Za-z])SGP?(?![A-Za-z])|singapore|🇺🇸|美国|(?<![A-Za-z])USA?(?![A-Za-z])|america|united\s*states)).*$'
    
# 📜 规则统一声明
anchors:
  _domain_anchor: &rule_providers_domain { type: http, interval: 86400, behavior: domain }
  _ip_anchor: &rule_providers_ip { type: http, interval: 86400, behavior: ipcidr }
  _classical_anchor: &rule_providers_classical { type: http, interval: 86400, behavior: classical }
 
# ─── 🪝 锚点定义区域 FINAL ───

# ─── 🛠️ 基础设置区域 START ───

ipv6: true
allow-lan: true
unified-delay: true
etag-support: true
tcp-concurrent: true
reset-network-change: true
auto-detect-interface: true
udp-timeout: 30          
keep-alive-interval: 60
bind-address: '*'
find-process-mode: strict
mode: rule
log-level: info     
external-controller: '127.0.0.1:9090'
external-ui: ui
external-ui-url: 'https://github.com/Zephyruso/zashboard/releases/latest/download/dist.zip'

profile:
  store-selected: true
  store-fake-ip: true
  disconnect-on-policy-change: true 
  
dns:
  enable: true
  use-hosts: true
  use-system-hosts: true
  ipv6: true
  cache-algorithm: arc
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-range6: 2001:2::1/48
  fake-ip-filter: ['rule-set:private', 'rule-set:fakeip_filter']
  # 专属 DNS ，若有机场有的话请取消下面的#并修改为机场提供的 DNS 地址
  #proxy-server-nameserver-policy:
  # 默认 DNS
  proxy-server-nameserver: *chinaDNS
  nameserver-policy:
    'rule-set:cn': *chinaDNS
  nameserver: *foreignDNS
  default-nameserver: ['223.5.5.5', '119.29.29.29']
  direct-nameserver: ['system', '223.5.5.5', '119.29.29.29']

hosts:
  'dns.alidns.com': ['223.5.5.5', '223.6.6.6']
  'doh.pub': ['1.12.12.12', '120.53.53.53']
  'dns.cloudflare.com': ['1.1.1.1', '1.0.0.1']
  'dns.google': ['8.8.8.8', '8.8.4.4']
  'services.googleapis.cn': ['services.googleapis.com']
  'google.cn': ['google.com']
  '+.edge.mountaintoys.cn': ['0.0.0.0']
  '+.mcdn.bilivideo.com': ['0.0.0.0']
  '+.mcdn.bilivideo.cn': ['0.0.0.0']
  '+.h2.smtcdns.net': ['0.0.0.0']
  
ntp:
  enable: true
  write-to-system: false
  server: 'ntp.aliyun.com'
  port: 123
  interval: 60
  
tun:
  enable: true
  auto-route: true
  auto-redirect: true
  auto-detect-interface: true
  stack: system
  dns-hijack: ['any:53', 'tcp://any:53']
  
# ─── 🛠️ 基础设置区域 FINAL ───

# ─── 🛩️ 节点提供区域 START ───

