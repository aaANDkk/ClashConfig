# ─── 🧩 锚点定义区域 BEGIN ───
# 统一订阅源的高级健康检查参数
airport: &airport
  type: http
  interval: 86400
  health-check:
    enable: true
    lazy: true
    interval: 10800
    timeout: 5000
    url: "https://g.cn/generate_204"            

# 自动化策略组基准模板（纯测速）
latency: &latency
  lazy: true
  hidden: true
  interval: 1200
  timeout: 5000
  tolerance: 50
  type: url-test
  url: "https://g.cn/generate_204"
  icon: "https://fastly.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Auto.png"
  
# 规则声明
anchors:
  _domain_anchor: &rule_providers_domain { type: http, interval: 86400, behavior: domain }
  _ip_anchor: &rule_providers_ip { type: http, interval: 86400, behavior: ipcidr }
  _classical_anchor: &rule_providers_classical { type: http, interval: 86400, behavior: classical }

# DNS 统一锚点
chinaDNS:
  &chinaDNS [
    'https://dns.alidns.com/dns-query#DIRECT',
    'https://doh.pub/dns-query#DIRECT'
  ]
foreignDNS:
  &foreignDNS [
    'https://dns.cloudflare.com/dns-query#Default',
    'https://dns.google/dns-query#Default'
  ]

# 统一所有功能分流组的可选节点队列
group: &group {type: select, proxies: [Default, Residential, Hong Kong, Taiwan, Japan, Singapore, United States, Other Regions]}

# 定义全局排除配置块（用于从源头过滤官网、流量、Web等信息）
global_exclude_filter: &global_exclude_filter { exclude-filter: '群|返利|循环|网址|获取|下次|官址|过期|已用|联系|邮箱|工单|贩卖|通知|倒卖|防止|国内|地址|频道|无法|说明|使用|提示|访问|支持|教程|关注|更新|作者|加入|超时|收藏|福利|邀请|好友|失联|选择|公益|发布|DIZTNA|通路|登录|禁止|定时|渠道|牢记|永久|余额|阁下|本站|刷新|导航|建议|以下|⚠️|@|expire|http|com|traffic|网站|官网|Web|重置|到期|剩余|流量|机场|客服|套餐|订阅|版本|备用' }

# 统一过滤器
filter_HK: &filter_HK '(?i)(🇭🇰|香港|(?<![A-Za-z])HK(?![A-Za-z])|hong\s*kong)'
filter_TW: &filter_TW '(?i)(🇹🇼|台湾|(?<![A-Za-z])TW(?![A-Za-z])|taiwan)'
filter_JP: &filter_JP '(?i)(🇯🇵|日本|(?<![A-Za-z])JP(?![A-Za-z])|japan)'
filter_SG: &filter_SG '(?i)(🇸🇬|新加坡|狮城|(?<![A-Za-z])SG(?![A-Za-z])|singapore)'
filter_US: &filter_US '(?i)(🇺🇸|美国|(?<![A-Za-z])US(?![A-Za-z])|[Aa]merica|[Uu]nited\s*[Ss]tates)'
filter_Others: &filter_Others '(?i)^(?!.*(🇭🇰|香港|(?<![A-Za-z])HK(?![A-Za-z])|hong\s*kong|🇯🇵|日本|(?<![A-Za-z])JP(?![A-Za-z])|japan|🇺🇸|美国|(?<![A-Za-z])US(?![A-Za-z])|[Aa]merica|[Uu]nited\s*[Ss]tates|🇸🇬|新加坡|狮城|(?<![A-Za-z])SG(?![A-Za-z])|singapore|🇹🇼|台湾|(?<![A-Za-z])TW(?![A-Za-z])|taiwan)).*'
filter_Home: &filter_Home '(?i)🏠|家庭|家宽|住宅|HOME|HINET|HKT|PCCW|Netvigator|HKBN|HGC|AT&T|Comcast|Xfinity|Spectrum|Cox|Verizon|Optimum|Frontier|CenturyLink|Quantum|Google Fiber|Starlink|So-net|Seednet|BIGLOBE|OCN|J:COM|SK Broadband|play'
# ─── 🧩 锚点定义区域 END ───

# ─── 🛠️ 基本设置区域 BEGIN ───
ipv6: true
allow-lan: true
unified-delay: true
etag-support: true
tcp-concurrent: true
reset-network-change: true
auto-detect-interface: true
udp-timeout: 30          
keep-alive-idle: 300
keep-alive-interval: 30
bind-address: '*'
find-process-mode: strict
mode: rule
log-level: info     
external-controller: '127.0.0.1:9090'
external-ui: ui
external-ui-url: 'https://github.com/Zephyruso/zashboard/releases/latest/download/dist.zip'

profile:
  store-selected: true
  store-fake-ip: true
  disconnect-on-policy-change: true 
  
dns:
  enable: true
  use-hosts: true
  use-system-hosts: true
  ipv6: true
  cache-algorithm: arc
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-range6: fd00:a4c5:9b12:d3f8:e760:00df::/96
  fake-ip-filter: ['rule-set:private', 'rule-set:fakeip_filter']
  # 若有机场专属DNS，请取消下面的注释并修改为机场提供的DNS地址
  #proxy-server-nameserver-policy:
  # 默认 DNS
  proxy-server-nameserver: *chinaDNS
  nameserver-policy:
    'rule-set:cn': *chinaDNS
  nameserver: *foreignDNS
  default-nameserver: ['223.5.5.5', '119.29.29.29']
  direct-nameserver: ['system', '223.5.5.5', '119.29.29.29']

hosts:
  'dns.alidns.com': ['223.5.5.5', '223.6.6.6']
  'doh.pub': ['1.12.12.12', '120.53.53.53']
  'dns.cloudflare.com': ['1.1.1.1', '1.0.0.1']
  'dns.google': ['8.8.8.8', '8.8.4.4']
  'services.googleapis.cn': ['services.googleapis.com']
  'google.cn': ['google.com']
  '+.edge.mountaintoys.cn': ['0.0.0.0']
  '+.mcdn.bilivideo.com': ['0.0.0.0']
  '+.mcdn.bilivideo.cn': ['0.0.0.0']
  '+.h2.smtcdns.net': ['0.0.0.0']
  
ntp:
  enable: true
  write-to-system: false
  server: 'ntp.aliyun.com'
  port: 123
  interval: 60
# ─── 🛠️ 基本设置区域 END ───

# ─── 🚀 节点提供区域 BEGIN ───
proxy-providers:
  # 机场订阅
  # 自行添加或删除①②③④⑤⑥⑦⑧⑨⑩
    
  ①:
    <<: [*airport, *global_exclude_filter]
    url: "填入订阅地址"
    override:
      additional-prefix: "① "  
      proxy-name:
        - { pattern: 'Tai Wan', target: 'Taiwan' }
      
  ②:
    <<: [*airport, *global_exclude_filter]
    url: "填入订阅地址"
    override:
      additional-prefix: "② "
      
  #模板:
    #<<: [*airport, *global_exclude_filter]
    #url: "填入订阅地址"
    #override:
      #additional-prefix: "模板 "
      #proxy-name: # 可自定义节点名称
        #- { pattern: '^A', target: '🇭🇰' }
        #- { pattern: '^B', target: '🇸🇬' }
        #- { pattern: '^C', target: '🇯🇵' }
# ─── 🚀 节点提供区域 END ─── 

# ─── 🎯 策略组区域 BEGIN ───
proxy-groups:
  # 💞核心组
  - {name: Default, type: select, proxies: [Hong Kong, Taiwan, Japan, Singapore, United States, Other Regions], icon: "https://fastly.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Proxy.png"}
  - {name: Direct, type: select, proxies: ['DIRECT'], url: "http://connectivitycheck.gstatic.com/generate_204", interval: 10800, icon: "https://fastly.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Direct.png", hidden: true}
  
  # 🛡️广告组
  - {name: AdBlock, type: select, proxies: ['Reject', 'Pass'], icon: "https://fastly.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/AdBlack.png"}
  - { name: 'Reject', type: select, proxies: [REJECT], icon: "https://fastly.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Reject.png", hidden: true}
  - { name: 'Pass', type: select, proxies: [PASS], icon: "https://fastly.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Static.png", hidden: true}

  # 🔀功能分流   
  - {name: ChatGPT, <<: *group, default-selected: 'Residential', icon: "https://raw.githubusercontent.com/aaANDkk/ClashConfig/main/icon/GPT.png"}
  - {name: Claude, <<: *group, default-selected: 'Residential', icon: "https://raw.githubusercontent.com/aaANDkk/ClashConfig/main/icon/Claude.png"}
  - {name: Gemini, <<: *group, default-selected: 'Residential', icon: "https://raw.githubusercontent.com/aaANDkk/ClashConfig/main/icon/Gemini.png"}
  - {name: TikTok, <<: *group, icon: "https://fastly.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/TikTok_1.png"}
  - {name: Anime, <<: *group, icon: "https://raw.githubusercontent.com/aaANDkk/ClashConfig/main/icon/Bahamut.png"}
  - {name: Media, <<: *group, icon: "https://fastly.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/ForeignMedia.png"}
  
  # 📋全部节点
  #- {name: All Proxies, type: select, include-all: true, icon: "https://raw.githubusercontent.com/aaANDkk/ClashConfig/main/icon/Available.png"}
  # 🏠家宽节点
  - {name: "RD-Auto", <<: *latency, include-all: true, filter: *filter_Home, exclude-type: Hysteria2} 
  - {name: Residential, type: select, include-all: true, filter: *filter_Home, proxies: ["RD-Auto"], icon: "https://raw.githubusercontent.com/aaANDkk/ClashConfig/main/icon/Home.png"}
  # 🌃香港
  - {name: "HK-Auto", <<: *latency, include-all: true, filter: *filter_HK, exclude-type: Hysteria2}
  - {name: Hong Kong, type: select, include-all: true, filter: *filter_HK, proxies: ["HK-Auto"], icon: "https://fastly.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Hong_Kong.png"}
  # 🧋台湾省
  - {name: "TW-Auto", <<: *latency, include-all: true, filter: *filter_TW, exclude-type: Hysteria2}
  - {name: Taiwan, type: select, include-all: true, filter: *filter_TW, proxies: ["TW-Auto"], icon: "https://fastly.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Taiwan.png"}
  # ⛩️日本
  - {name: "JP-Auto", <<: *latency, include-all: true, filter: *filter_JP, exclude-type: Hysteria2}
  - {name: Japan, type: select, include-all: true, filter: *filter_JP, proxies: ["JP-Auto"], icon: "https://fastly.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Japan.png"}
  # 🦁新加坡
  - {name: "SG-Auto", <<: *latency, include-all: true, filter: *filter_SG, exclude-type: Hysteria2}
  - {name: Singapore, type: select, include-all: true, filter: *filter_SG, proxies: ["SG-Auto"], icon: "https://fastly.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Singapore.png"}
  # 🗽美国
  - {name: "US-Auto", <<: *latency, include-all: true, filter: *filter_US, exclude-type: Hysteria2}
  - {name: United States, type: select, include-all: true, filter: *filter_US, proxies: ["US-Auto"], icon: "https://fastly.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/United_States.png"}
  # 🌏其余地区
  - {name: "OR-Auto", <<: *latency, include-all: true, filter: *filter_Others, exclude-type: Hysteria2}
  - {name: Other Regions, type: select, include-all: true, filter: *filter_Others, proxies: ["OR-Auto"], icon: "https://fastly.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/World_Map.png"}
# ─── 🎯 策略组区域 END ───

