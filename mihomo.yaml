  # 代理
  geolocation-!cn: { <<: *rule_providers_domain, format: mrs, url: "https://fastly.jsdelivr.net/gh/appshubcc/bett-rules@meta/geo/geosite/geolocation-!cn.mrs", path: "./ruleset/geolocation-!cn.mrs", path-in-bundle: "geo/geosite/geolocation-!cn.mrs" }
