######### 🚀 锚点定义区域 start #######
# 1. 统一订阅源的高级健康检查参数
airport: &airport
  type: http
  interval: 86400
  health-check:
    enable: true
    lazy: true
    interval: 10800
    timeout: 5000
    url: "https://g.cn/generate_204"            

# 2. 自动化策略组基准模板（纯测速）
ut: &ut
  lazy: true
  hidden: true
  interval: 1500
  timeout: 5000
  tolerance: 85
  type: url-test
  url: "https://g.cn/generate_204"
  icon: "https://fastly.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Auto.png"
  
# 3. 声明规则
anchors:
  _domain_anchor: &rule_providers_domain { type: http, interval: 86400, behavior: domain }
  _ip_anchor: &rule_providers_ip { type: http, interval: 86400, behavior: ipcidr }
  _classical_anchor: &rule_providers_classical { type: http, interval: 86400, behavior: classical }

# 4. DNS 统一锚点
chinaDNS:
  &chinaDNS [
    'https://dns.alidns.com/dns-query#DIRECT', 
    'https://doh.pub/dns-query#DIRECT'
  ]
foreignDNS:
  &foreignDNS [
    'https://dns.cloudflare.com/dns-query#Default',
    'https://dns.google/dns-query#Default'
  ]

# 5. 定义全局排除配置块（用于从源头过滤官网、流量、Web等信息）
global_exclude_filter: &global_exclude_filter { exclude-filter: '群|返利|循环|网址|获取|下次|官址|过期|已用|联系|邮箱|工单|贩卖|通知|倒卖|防止|国内|地址|频道|无法|说明|使用|提示|访问|支持|教程|关注|更新|作者|加入|超时|收藏|福利|邀请|好友|失联|选择|公益|发布|DIZTNA|通路|登录|禁止|定时|渠道|牢记|永久|余额|阁下|本站|刷新|导航|建议|以下|⚠️|@|expire|http|com|traffic|官方网站|官网|Web|重置|到期|剩余|流量|机场|客服|套餐|订阅|版本|备用' }

# 6. 统一过滤器
fhk: &fhk '(?i)(🇭🇰|香港|(?<![A-Za-z])HK(?![A-Za-z])|hong\s*kong)'
ftw: &ftw '(?i)(🇹🇼|台湾|(?<![A-Za-z])TW(?![A-Za-z])|taiwan)'
fjp: &fjp '(?i)(🇯🇵|日本|(?<![A-Za-z])JP(?![A-Za-z])|japan)'
fsg: &fsg '(?i)(🇸🇬|新加坡|狮城|(?<![A-Za-z])SG(?![A-Za-z])|singapore)'
fus: &fus '(?i)(🇺🇸|美国|(?<![A-Za-z])US(?![A-Za-z])|[Aa]merica|[Uu]nited\s*[Ss]tates)'
fot: &fot '(?i)^(?!.*(🇭🇰|香港|(?<![A-Za-z])HK(?![A-Za-z])|hong\s*kong|🇯🇵|日本|(?<![A-Za-z])JP(?![A-Za-z])|japan|🇺🇸|美国|(?<![A-Za-z])US(?![A-Za-z])|[Aa]merica|[Uu]nited\s*[Ss]tates|🇸🇬|新加坡|狮城|(?<![A-Za-z])SG(?![A-Za-z])|singapore|🇹🇼|台湾|(?<![A-Za-z])TW(?![A-Za-z])|taiwan)).*'
ful: &ful '(?i)🏠|家庭|家宽|住宅|HOME|HINET|HKT'

# 7. 统一所有功能分流组的可选节点队列
group: &group {type: select, proxies: [Default, Residential, Hong Kong, Taiwan, Japan, Singapore, United States, Rest of World]}
######### 🚀 锚点定义区域 end #######

proxy-providers:
  # 机场订阅
  # 自行添加或删除①②③④⑤⑥⑦⑧⑨⑩
  ①:
    <<: [*airport, *global_exclude_filter]
    url: "填入订阅地址"
    override:
      additional-prefix: "① "

  ②:
    <<: [*airport, *global_exclude_filter]
    url: "填入订阅地址"
    override:
      additional-prefix: "② "  

# 基础配置项
ipv6: true
allow-lan: true
unified-delay: true
etag-support: true
tcp-concurrent: true
reset-network-change: true
auto-detect-interface: true
udp-timeout: 30          
tcp-keep-alive-idle: 600        
keep-alive-interval: 60
bind-address: '*'
find-process-mode: strict
mode: rule
log-level: info     
external-controller: '127.0.0.1:9090'
external-ui: ui
external-ui-url: 'https://github.com/Zephyruso/zashboard/releases/latest/download/dist.zip'

profile:
  store-selected: true
  store-fake-ip: true
  disconnect-on-policy-change: true 

dns:
  enable: true
  direct-nameserver-follow-policy: true
  use-hosts: true
  use-system-hosts: true
  ipv6: true
  ip-version: ipv4_prefer     
  cache-algorithm: arc
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter: ['rule-set:private', 'rule-set:fakeip_filter']
  proxy-server-nameserver: *chinaDNS
  default-nameserver: ['223.5.5.5', '119.29.29.29']
  nameserver: *foreignDNS
  nameserver-policy:
    'rule-set:cn': *chinaDNS
  direct-nameserver: ['system', '223.5.5.5', '119.29.29.29']

hosts:
  'dns.alidns.com': ['223.5.5.5', '223.6.6.6']
  'doh.pub': ['1.12.12.12', '120.53.53.53']
  'dns.cloudflare.com': ['1.1.1.1', '1.0.0.1']
  'dns.google': ['8.8.8.8', '8.8.4.4']
  'services.googleapis.cn': ['services.googleapis.com']
  'google.cn': ['google.com']
  '+.edge.mountaintoys.cn': ['0.0.0.0']
  # 屏蔽哔哩哔哩PCDN，解决卡顿问题
  '+.mcdn.bilivideo.com': ['0.0.0.0']
  '+.mcdn.bilivideo.cn': ['0.0.0.0']
  '+.h2.smtcdns.net': ['0.0.0.0']
  
ntp:
  enable: true
  write-to-system: false
  server: 'ntp.aliyun.com'
  port: 123
  interval: 60

proxy-groups:
  # 💞核心组
  - {name: Default, type: select, proxies: [Hong Kong, Taiwan, Japan, Singapore, United States, Rest of World], default-selected: 'Japan', icon: "https://fastly.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Proxy.png"}
  - {name: Direct, type: select, proxies: ['DIRECT'], url: "https://g.cn/generate_204", interval: 10800, icon: "https://fastly.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Direct.png", hidden: true}
  
  # 🛡️广告组
  - {name: Advertising, type: select, proxies: ['Refuse', 'Permit'], icon: "https://fastly.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Advertising.png"}
  - { name: 'Refuse', type: select, proxies: [REJECT], icon: "https://fastly.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Reject.png", hidden: true}
  - { name: 'Permit', type: select, proxies: [PASS], icon: "https://fastly.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Static_1.png", hidden: true}

  # 🔀功能分流   
  - {name: ChatGPT, <<: *group, default-selected: 'Residential', icon: "https://raw.githubusercontent.com/aaANDkk/ClashConfig/main/icon/GPT.png"}
  - {name: Claude, <<: *group, default-selected: 'Residential', icon: "https://raw.githubusercontent.com/aaANDkk/ClashConfig/main/icon/Claude.png"}
  - {name: Gemini, <<: *group, default-selected: 'Residential', icon: "https://raw.githubusercontent.com/aaANDkk/ClashConfig/main/icon/Gemini.png"}
  - {name: TikTok, <<: *group, icon: "https://fastly.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/TikTok_1.png"}
  - {name: Anime, <<: *group, icon: "https://raw.githubusercontent.com/aaANDkk/ClashConfig/main/icon/Bahamut.png"}
  - {name: Media, <<: *group, icon: "https://fastly.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/ForeignMedia.png"}
  - {name: Others, type: select, proxies: [Proxy, Direct], icon: "https://fastly.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Final.png"}
  
  # 🏠家宽节点
  - {name: "RSD-Auto", <<: *ut, include-all: true, filter: *ful, exclude-type: Hysteria2} 
  - {name: Residential, type: select, include-all: true, filter: *ful, proxies: ["RSD-Auto"], icon: "https://raw.githubusercontent.com/aaANDkk/ClashConfig/main/icon/Home.png"}
  # 🌃香港
  - {name: "HKG-Auto", <<: *ut, include-all: true, filter: *fhk, exclude-type: Hysteria2}
  - {name: Hong Kong, type: select, include-all: true, filter: *fhk, proxies: ["HKG-Auto"], icon: "https://fastly.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Hong_Kong.png"}
  # 🧋台湾省
  - {name: "TWN-Auto", <<: *ut, include-all: true, filter: *ftw, exclude-type: Hysteria2}
  - {name: Taiwan, type: select, include-all: true, filter: *ftw, proxies: ["TWN-Auto"], icon: "https://fastly.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Taiwan.png"}
  # ⛩️日本
  - {name: "JPN-Auto", <<: *ut, include-all: true, filter: *fjp, exclude-type: Hysteria2}
  - {name: Japan, type: select, include-all: true, filter: *fjp, proxies: ["JPN-Auto"], icon: "https://fastly.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Japan.png"}
  # 🦁新加坡
  - {name: "SGP-Auto", <<: *ut, include-all: true, filter: *fsg, exclude-type: Hysteria2}
  - {name: Singapore, type: select, include-all: true, filter: *fsg, proxies: ["SGP-Auto"], icon: "https://fastly.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Singapore.png"}
  # 🗽美国
  - {name: "USA-Auto", <<: *ut, include-all: true, filter: *fus, exclude-type: Hysteria2}
  - {name: United States, type: select, include-all: true, filter: *fus, proxies: ["USA-Auto"], icon: "https://fastly.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/United_States.png"}
  # 🌏其余地区
  - {name: "ROW-Auto", <<: *ut, include-all: true, filter: *fot, exclude-type: Hysteria2}
  - {name: Rest of World, type: select, include-all: true, filter: *fot, proxies: ["ROW-Auto"], icon: "https://fastly.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/World_Map.png"}
  
rule-providers:  
  # 杂七杂八
  private: { <<: *rule_providers_domain, format: mrs, url: "https://fastly.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@meta/geo/geosite/private.mrs", path: "./ruleset/private.mrs" }
  private_ip: { <<: *rule_providers_ip, format: mrs, url: "https://fastly.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@meta/geo/geoip/private.mrs", path: "./ruleset/private_ip.mrs" }
  fakeip_filter: { <<: *rule_providers_domain, format: mrs, url: "https://fastly.jsdelivr.net/gh/wwqgtxx/clash-rules@release/fakeip-filter.mrs", path: "./ruleset/fakeip-filter.mrs" }
