# ─── 🪝 锚点定义区域 START ───

# 规则统一声明
anchors:
  _domain_anchor: &rule_providers_domain { type: http, interval: 86400, behavior: domain }
  _ip_anchor: &rule_providers_ip { type: http, interval: 86400, behavior: ipcidr }
  _classical_anchor: &rule_providers_classical { type: http, interval: 86400, behavior: classical }

# 订阅源健康统一检查参数
airport: &airport
  type: http
  exclude-type: "DIRECT|REJECT|REMATCH"
  interval: 86400
  health-check:
    enable: true
    lazy: true
    interval: 1200
    timeout: 3000
    url: "http://g.cn/generate_204"

# 基础组统一特性
base: &base
  interval: 1200
  timeout: 3000
  type: select
  empty-fallback: REJECT
  url: "http://g.cn/generate_204"

# 策略组统一特性
group: &group
  interval: 1200
  timeout: 3000
  type: select
  empty-fallback: REJECT
  url: "http://g.cn/generate_204"
  proxies:
    - Default
    - Direct
    - All Proxies
    - Residential
    - Hong Kong
    - Taiwan
    - Japan
    - Singapore
    - United States

# 自动选择统一特性
auto: &auto
  lazy: true
  hidden: true
  include-all: true
  max-failed-times: 2
  interval: 1200
  timeout: 3000
  tolerance: 80
  type: url-test
  empty-fallback: REJECT
  exclude-type: "DIRECT|REJECT|Hysteria2"
  url: "http://g.cn/generate_204"
  icon: "https://fastly.jsdelivr.net/gh/aaANDkk/ClashConfig@main/icon/svg/common/Auto.svg"

# 手动选择统一特性
manual: &manual
  include-all: true
  interval: 1200
  timeout: 3000
  type: select
  empty-fallback: REJECT
  exclude-type: "DIRECT|REJECT"
  url: "http://g.cn/generate_204"

# 自动选择排除规则（排除垃圾/提示/备用/直连/下载/低倍节点）
auto_exclude: &auto_exclude
  exclude-filter: '(?i)(vpn|卖|版本|泄露|剩余|到期|过期|重置|流量|套餐|订阅|官网|网址|网站|客服|工单|群组|频道|通知|超时|备用|直连|下载|(?<!\d)0\.[0-5]|(?:https?:\/\/|\.com|\.org|\.net|@|⚠️))'

# 手动选择排除规则（排除垃圾/提示/备用节点）
manual_exclude: &manual_exclude
  exclude-filter: '(?i)(vpn|卖|版本|泄露|剩余|到期|过期|重置|流量|套餐|订阅|官网|网址|网站|客服|工单|群组|频道|通知|超时|备用|(?:https?:\/\/|\.com|\.org|\.net|@|⚠️))'

# 纯地区匹配正则
group_filter:
  filter_Home: &filter_Home
    filter: "(?i)(🏠|🏡|家庭|家宽|住宅|HOME|ISP|HINET|HKT)"
  filter_HK: &filter_HK
    filter: '(?i)(🇭🇰|香港|(?<![A-Za-z])HKG?(?![A-Za-z])|hong\s*kong)'
  filter_TW: &filter_TW
    filter: "(?i)(🇹🇼|台湾|(?<![A-Za-z])TWN?(?![A-Za-z])|taiwan)"
  filter_JP: &filter_JP
    filter: "(?i)(🇯🇵|日本|(?<![A-Za-z])JPN?(?![A-Za-z])|japan)"
  filter_SG: &filter_SG
    filter: "(?i)(🇸🇬|新加坡|狮城|(?<![A-Za-z])SGP?(?![A-Za-z])|singapore)"
  filter_US: &filter_US
    filter: '(?i)(🇺🇸|美国|(?<![A-Za-z])USA?(?![A-Za-z])|america|united\s*states)'

# DNS 统一锚点
dns_common:
  foreignDNS: &foreignDNS
    - "https://cloudflare-dns.com/dns-query#Default"
    - "https://dns.google/dns-query#Default"
  chinaDNS: &chinaDNS
    - "223.5.5.5#DIRECT"
    - "119.29.29.29#DIRECT"
  defaultDNS: &defaultDNS
    - "114.114.114.114#DIRECT"
    - "tls://223.5.5.5#DIRECT"
    - "https://1.12.12.12/dns-query#DIRECT"
  proxyDNS: &proxyDNS
    - "114.114.114.114#DIRECT"
    - "tls://223.5.5.5#DIRECT"
    - "https://doh.pub/dns-query#DIRECT"
  douyinDNS: &douyinDNS
    - "180.184.1.1#DIRECT"
    - "180.184.2.2#DIRECT"
  aiDNS: &aiDNS
    - "https://cloudflare-dns.com/dns-query#AI"
    - "https://dns.google/dns-query#AI"

# ─── 🪝 锚点定义区域 FINAL ───

# ─── 🛠 基础设置区域 START ───

ipv6: false
allow-lan: true
unified-delay: true
etag-support: true
tcp-concurrent: true
reset-network-change: true
auto-detect-interface: true
udp-timeout: 30
keep-alive-interval: 60
bind-address: "*"
find-process-mode: strict
mode: rule
log-level: info
external-controller: "127.0.0.1:9090"
external-ui: ui
external-ui-url: "https://github.com/Zephyruso/zashboard/releases/latest/download/dist.zip"

dns:
  enable: true
  use-hosts: true
  use-system-hosts: true
  ipv6: false
  cache-algorithm: arc
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/15
  fake-ip-range6: 2001:2::1/48
  fake-ip-filter:
    - "rule-set:private"
    - "rule-set:fakeip_filter"
    - "rule-set:connectivity_check"
    - "rule-set:googlefcm"
    - "rule-set:cn"
  # 基础解析 DNS
  direct-nameserver-follow-policy: true
  direct-nameserver: *chinaDNS
  default-nameserver: *defaultDNS
  # 业务解析 DNS
  nameserver: *foreignDNS
  nameserver-policy:
    "rule-set:private": "system"
    "rule-set:ai": *aiDNS
    "rule-set:douyin": *douyinDNS
    "rule-set:cn": *chinaDNS
  # 节点解析 DNS
  proxy-server-nameserver: *proxyDNS

hosts:
  "doh.pub": ["1.12.12.12", "120.53.53.53"]
  "dns.google": ["8.8.8.8", "8.8.4.4"]
  "cloudflare-dns.com": ["1.1.1.1", "1.0.0.1"]
  # 解决 Google Play 问题
  "services.googleapis.cn": "services.googleapis.com"
  # 解决部分卡顿问题
  "+.mcdn.bilivideo.com": ["0.0.0.0"]
  "+.mcdn.bilivideo.cn": ["0.0.0.0"]
  "+.h2.smtcdns.net": ["0.0.0.0"]
  "+.edge.mountaintoys.cn": ["0.0.0.0"]

profile:
  store-selected: true
  store-fake-ip: true
  disconnect-on-policy-change: true

ntp:
  enable: true
  write-to-system: false
  server: "ntp.aliyun.com"
  port: 123
  interval: 60

tun:
  enable: true
  auto-route: true
  auto-redirect: true
  auto-detect-interface: true
  stack: mips
  dns-hijack: ["any:53", "tcp://any:53"]

# ─── 🛠 基础设置区域 FINAL ───

# ─── 🚀 节点提供区域 START ───

proxy-providers:
  # 输入机场订阅，可自行添加或删除多个订阅
  # ❶ ❷ ❸ ❹ ❺ ❻ ❼ ❽ ❾ ❿
  # ① ② ③ ④ ⑤ ⑥ ⑦ ⑧ ⑨ ⑩

  ❶|一号机场:
    <<: *airport
    url: "此处填入1号机场订阅地址"
    override:
      additional-prefix: "① "

  ❷|二号机场:
    <<: *airport
    url: "此处填入2号机场订阅地址"
    override:
      additional-prefix: "② "

proxies:
  - {name: "🇨🇳 直连 | 双栈", type: direct }

# ─── 🚀 节点提供区域 FINAL ───

# ─── 🧭 策略分组区域 START ───

proxy-groups:
  # 基础组
  - {name: GLOBAL, <<: *base, proxies: [Default, Direct, WebRTC, QUIC, AdBlock, FCM, Google, AI, GitHub, Telegram, Twitter, TikTok, Anime, Media, Final, All Proxies, ALL-Auto, Residential, RSD-Auto, Hong Kong, HKG-Auto, Taiwan, TWN-Auto, Japan, JPN-Auto, Singapore, SGP-Auto, United States, USA-Auto], icon: "https://fastly.jsdelivr.net/gh/aaANDkk/ClashConfig@main/icon/svg/common/Global.svg"}
  - {name: Default, <<: *base, proxies: [All Proxies, Residential, Hong Kong, Taiwan, Japan, Singapore, United States], icon: "https://fastly.jsdelivr.net/gh/aaANDkk/ClashConfig@main/icon/svg/common/Proxy.svg"}
  - {name: Direct, <<: *base, proxies: [🇨🇳 直连 | 双栈], hidden: true, icon: "https://fastly.jsdelivr.net/gh/aaANDkk/ClashConfig@main/icon/svg/common/Direct.svg"}

  # 拦截组（默认拦截，可切换 Pass 临时放行）
  - {name: WebRTC, <<: *base, proxies: [Reject, Pass], icon: "https://fastly.jsdelivr.net/gh/aaANDkk/ClashConfig@main/icon/svg/common/WebRTC.svg"}
  - {name: QUIC, <<: *base, proxies: [Reject, Pass], icon: "https://fastly.jsdelivr.net/gh/aaANDkk/ClashConfig@main/icon/svg/common/Quic.svg"}
  - {name: AdBlock, <<: *base, proxies: [Reject, Pass], icon: "https://fastly.jsdelivr.net/gh/aaANDkk/ClashConfig@main/icon/svg/common/AdBlock.svg"}
  - {name: Reject, <<: *base, proxies: [REJECT], hidden: true, icon: "https://fastly.jsdelivr.net/gh/aaANDkk/ClashConfig@main/icon/svg/common/Reject.svg"}
  - {name: Pass, <<: *base, proxies: [PASS], hidden: true, icon: "https://fastly.jsdelivr.net/gh/aaANDkk/ClashConfig@main/icon/svg/common/Static.svg"}

  # 策略组
  - {name: FCM, <<: *group, default-selected: "Direct", icon: "https://fastly.jsdelivr.net/gh/aaANDkk/ClashConfig@main/icon/svg/common/FCM.svg"}
  - {name: Google, <<: *group, icon: "https://fastly.jsdelivr.net/gh/aaANDkk/ClashConfig@main/icon/svg/common/Google.svg"}
  - {name: AI, <<: *group, default-selected: "Residential", icon: "https://fastly.jsdelivr.net/gh/aaANDkk/ClashConfig@main/icon/svg/common/ChatGPT.svg"}
  - {name: GitHub, <<: *group, icon: "https://fastly.jsdelivr.net/gh/aaANDkk/ClashConfig@main/icon/svg/common/GitHub.svg"}
  - {name: Telegram, <<: *group, icon: "https://fastly.jsdelivr.net/gh/aaANDkk/ClashConfig@main/icon/svg/common/Telegram.svg"}
  - {name: Twitter, <<: *group, icon: "https://fastly.jsdelivr.net/gh/aaANDkk/ClashConfig@main/icon/svg/common/Twitter.svg"}
  - {name: TikTok, <<: *group, icon: "https://fastly.jsdelivr.net/gh/aaANDkk/ClashConfig@main/icon/svg/common/TikTok.svg"}
  - {name: Anime, <<: *group, icon: "https://fastly.jsdelivr.net/gh/aaANDkk/ClashConfig@main/icon/svg/common/Bahamut.svg"}
  - {name: Media, <<: *group, icon: "https://fastly.jsdelivr.net/gh/aaANDkk/ClashConfig@main/icon/svg/common/Media.svg"}
  - {name: Final, <<: *group, icon: "https://fastly.jsdelivr.net/gh/aaANDkk/ClashConfig@main/icon/svg/common/Final.svg"}

  # 全部节点
  - name: "ALL-Auto"
    <<: [*auto, *auto_exclude]
  - name: "All Proxies"
    <<: [*manual, *manual_exclude]
    proxies: ["ALL-Auto"]
    icon: "https://fastly.jsdelivr.net/gh/aaANDkk/ClashConfig@main/icon/svg/common/Available.svg"

  # 家宽节点
  - name: "RSD-Auto"
    <<: [*auto, *auto_exclude, *filter_Home]
  - name: "Residential"
    <<: [*manual, *manual_exclude, *filter_Home]
    proxies: ["RSD-Auto"]
    icon: "https://fastly.jsdelivr.net/gh/aaANDkk/ClashConfig@main/icon/svg/common/Home.svg"

  # 香港节点
  - name: "HKG-Auto"
    <<: [*auto, *auto_exclude, *filter_HK]
  - name: "Hong Kong"
    <<: [*manual, *manual_exclude, *filter_HK]
    proxies: ["HKG-Auto"]
    icon: "https://fastly.jsdelivr.net/gh/aaANDkk/ClashConfig@main/icon/svg/flag/Hong_Kong.svg"

  # 台湾节点
  - name: "TWN-Auto"
    <<: [*auto, *auto_exclude, *filter_TW]
    include-all: true
  - name: "Taiwan"
    <<: [*manual, *manual_exclude, *filter_TW]
    proxies: ["TWN-Auto"]
    icon: "https://fastly.jsdelivr.net/gh/aaANDkk/ClashConfig@main/icon/svg/flag/China_Taiwan.svg"

  # 日本节点
  - name: "JPN-Auto"
    <<: [*auto, *auto_exclude, *filter_JP]
  - name: "Japan"
    <<: [*manual, *manual_exclude, *filter_JP]
    proxies: ["JPN-Auto"]
    icon: "https://fastly.jsdelivr.net/gh/aaANDkk/ClashConfig@main/icon/svg/flag/Japan.svg"

  # 新加坡节点
  - name: "SGP-Auto"
    <<: [*auto, *auto_exclude, *filter_SG]
  - name: "Singapore"
    <<: [*manual, *manual_exclude, *filter_SG]
    proxies: ["SGP-Auto"]
    icon: "https://fastly.jsdelivr.net/gh/aaANDkk/ClashConfig@main/icon/svg/flag/Singapore.svg"

  # 美国节点
  - name: "USA-Auto"
    <<: [*auto, *auto_exclude, *filter_US]
  - name: "United States"
    <<: [*manual, *manual_exclude, *filter_US]
    proxies: ["USA-Auto"]
    icon: "https://fastly.jsdelivr.net/gh/aaANDkk/ClashConfig@main/icon/svg/flag/United_States.svg"

# ─── 🧭 策略分组区域 FINAL ───

# ─── 📦 规则集合区域 START ───

