# ─── 🚀 节点提供区域 START ───

# 订阅源健康统一检查参数
airport: &airport
  type: http
  interval: 86400
  health-check:
    enable: true
    lazy: true
    interval: 10800
    timeout: 5000
    url: "http://g.cn/generate_204"     
    
proxy-providers:
  # 输入机场订阅，可自行添加或删除多个订阅   
  # ❶ ❷ ❸ ❹ ❺ ❻ ❼ ❽ ❾ ❿
  # ① ② ③ ④ ⑤ ⑥ ⑦ ⑧ ⑨ ⑩

  ❶:
    <<: *airport
    url: "此处填入1号机场订阅地址"
    override:
      additional-prefix: "① "  

  ❷:
    <<: *airport
    url: "此处填入2号机场订阅地址"
    override:
      additional-prefix: "② "  

  #模板:
    #<<: *airport
    #url: "填入订阅地址"
    #override:
      #additional-prefix: "模板 "
      #proxy-name: # 可自定义节点名称
        #- { pattern: 'A', target: '🇭🇰' }
        #- { pattern: 'B', target: '🇸🇬' }
        #- { pattern: 'C', target: '🇯🇵' }
        #- { pattern: '^直连\s*(\S+)\s*([\p{Han}A-Za-z]+)\s*(\d*)(.*)$', target: '$1 $2直连 $3$4' }
        #- { pattern: '-(?=\d+x|\d+\.\d+x)', target: ' ' }
        #- { pattern: '[gG]emini', target: '送中' }

proxies:
  - { name: '🇨🇳 直连 | 双栈', type: direct }
  
# ─── 🚀 节点提供区域 FINAL ─── 

# ─── 🛠 基础设置区域 START ───

ipv6: true
allow-lan: true
unified-delay: true
etag-support: true
tcp-concurrent: true
reset-network-change: true
auto-detect-interface: true
udp-timeout: 30          
keep-alive-interval: 60
bind-address: '*'
find-process-mode: strict
mode: rule
log-level: info     
external-controller: '127.0.0.1:9090'
external-ui: ui
external-ui-url: 'https://github.com/Zephyruso/zashboard/releases/latest/download/dist.zip'
  
# DNS 统一锚点
chinaDNS: &chinaDNS
  - 'https://223.5.5.5/dns-query#DIRECT'
  - 'https://1.12.12.12/dns-query#DIRECT'
foreignDNS: &foreignDNS
  - 'https://cloudflare-dns.com/dns-query#Default'
  - 'https://dns.google/dns-query#Default'

dns:
  enable: true
  use-hosts: true
  use-system-hosts: true
  ipv6: true
  cache-algorithm: arc
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/15
  fake-ip-range6: 2001:2::1/48
  fake-ip-filter: ['rule-set:private', 'rule-set:fakeip_filter', 'rule-set:geolocation-cn']
  # 基础解析 DNS
  direct-nameserver: [system, 223.5.5.5, 119.29.29.29]
  default-nameserver: [223.5.5.5, 119.29.29.29]
  # 业务解析 DNS
  nameserver: *foreignDNS
  nameserver-policy:
    'rule-set:cn': [223.5.5.5, 119.29.29.29]
  # 节点解析 DNS
  proxy-server-nameserver: *chinaDNS
  #proxy-server-nameserver-policy:

hosts:
  'cloudflare-dns.com': ['1.1.1.1', '1.0.0.1']
  'dns.google': ['8.8.8.8', '8.8.4.4']
  # 解决部分谷歌问题
  'services.googleapis.cn': ['services.googleapis.com']
  'google.cn': ['google.com']
  # 解决部分卡顿问题
  '+.mcdn.bilivideo.com': ['0.0.0.0']
  '+.mcdn.bilivideo.cn': ['0.0.0.0']
  '+.h2.smtcdns.net': ['0.0.0.0']
  '+.edge.mountaintoys.cn': ['0.0.0.0']
 
profile:
  store-selected: true
  store-fake-ip: true
  disconnect-on-policy-change: true 
 
ntp:
  enable: true
  write-to-system: false
  server: 'ntp.aliyun.com'
  port: 123
  interval: 60
  
tun:
  enable: true
  auto-route: true
  auto-redirect: true
  auto-detect-interface: true
  stack: mixed
  dns-hijack: ['any:53', 'tcp://any:53']
  
# ─── 🛠 基础设置区域 FINAL ───

# ─── 🧭 策略分组区域 START ───

# 自动选择统一特性
auto: &auto
  include-all: true
  lazy: true
  hidden: true
  interval: 1800
  timeout: 5000
  tolerance: 80
  type: url-test
  exclude-type: 'Hysteria2|Direct'
  url: "http://g.cn/generate_204"
  icon: "https://fastly.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Auto.png"
  
# 手动选择统一特性
manual: &manual
  include-all: true
  type: select
  exclude-type: Direct

# 自动选择排除规则（排除垃圾/提示节点 + 备用 + 低倍率节点）
auto_exclude: &auto_exclude
  exclude-filter: '(?i)(版本|泄露|剩余|到期|过期|重置|流量|套餐|订阅|官网|网址|网站|客服|工单|群组|频道|通知|超时|卖|备用|(?<!\d)0\.[0-5]|(?:https?:\/\/|\.com|\.org|\.net|@|⚠️))'

# 手动选择排除规则（仅排除垃圾/提示节点，保留备用与低倍率）
manual_exclude: &manual_exclude
  exclude-filter: '(?i)(版本|泄露|剩余|到期|过期|重置|流量|套餐|订阅|官网|网址|客服|工单|群组|频道|通知|超时|卖|(?:https?:\/\/|\.com|\.org|\.net|@|⚠️))'

# 纯地区匹配正则
group_filter:
  filter_Home: &filter_Home
    filter: '(?i)(🏠|🏡|家庭|家宽|住宅|HOME|ISP|HINET|HKT)'
  filter_HK: &filter_HK
    filter: '(?i)(🇭🇰|香港|(?<![A-Za-z])HKG?(?![A-Za-z])|hong\s*kong)'
  filter_TW: &filter_TW
    filter: '(?i)(🇹🇼|台湾|(?<![A-Za-z])TWN?(?![A-Za-z])|taiwan)'
  filter_JP: &filter_JP
    filter: '(?i)(🇯🇵|日本|(?<![A-Za-z])JPN?(?![A-Za-z])|japan)'
  filter_SG: &filter_SG
    filter: '(?i)(🇸🇬|新加坡|狮城|(?<![A-Za-z])SGP?(?![A-Za-z])|singapore)'
  filter_US: &filter_US
    filter: '(?i)(🇺🇸|美国|(?<![A-Za-z])USA?(?![A-Za-z])|america|united\s*states)'
  filter_Others: &filter_Others
    filter: '^(?!.*(?i)(🇭🇰|香港|(?<![A-Za-z])HKG?(?![A-Za-z])|hong\s*kong|🇹🇼|台湾|(?<![A-Za-z])TWN?(?![A-Za-z])|taiwan|🇯🇵|日本|(?<![A-Za-z])JPN?(?![A-Za-z])|japan|🇸🇬|新加坡|狮城|(?<![A-Za-z])SGP?(?![A-Za-z])|singapore|🇺🇸|美国|(?<![A-Za-z])USA?(?![A-Za-z])|america|united\s*states)).*$'
    
# 策略组统一可选节点
group: &group {type: select, proxies: [Default, Direct, All Proxies, Residential, Hong Kong, Taiwan, Japan, Singapore, United States, Other Regions]}

proxy-groups:
  # 默认组
  - {name: Default, type: select, proxies: [All Proxies, Residential, Hong Kong, Taiwan, Japan, Singapore, United States, Other Regions], icon: "https://fastly.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Proxy.png"}
  - {name: Direct, type: select, proxies: [🇨🇳 直连 | 双栈], url: "http://connectivitycheck.platform.hicloud.com/generate_204", interval: 10800, icon: "https://fastly.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Direct.png", hidden: true}
  
  # 拦截组
  - {name: AdBlock, type: select, proxies: [Reject, Pass], icon: "https://fastly.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/AdBlack.png"}
  - {name: Reject, type: select, proxies: [REJECT], icon: "https://fastly.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Reject.png", hidden: true}
  - {name: Pass, type: select, proxies: [PASS], icon: "https://fastly.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Static.png", hidden: true}
  
  # 功能分流组
  - {name: Speedtest, <<: *group, default-selected: 'Direct', icon: "https://raw.githubusercontent.com/aaANDkk/ClashConfig/main/icon/Speedtest.png"}  
  - {name: ChatGPT, <<: *group, default-selected: 'Residential', icon: "https://raw.githubusercontent.com/aaANDkk/ClashConfig/main/icon/GPT.png"}
  - {name: Claude, <<: *group, default-selected: 'Residential', icon: "https://raw.githubusercontent.com/aaANDkk/ClashConfig/main/icon/Claude.png"}
  - {name: Gemini, <<: *group, default-selected: 'Residential', icon: "https://raw.githubusercontent.com/aaANDkk/ClashConfig/main/icon/Gemini.png"}
  - {name: TikTok, <<: *group, icon: "https://fastly.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/TikTok_1.png"}
  - {name: Anime, <<: *group, icon: "https://raw.githubusercontent.com/aaANDkk/ClashConfig/main/icon/Bahamut.png"}
  - {name: Media, <<: *group, icon: "https://fastly.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Media.png"}
  
  # 节点分组
  - {name: ALL-Auto, <<: [*auto, *auto_exclude]}
  - {name: All Proxies, <<: *manual, proxies: [ALL-Auto], icon: "https://raw.githubusercontent.com/aaANDkk/ClashConfig/main/icon/Available.png"}
  - {name: RSD-Auto, <<: [*auto, *auto_exclude, *filter_Home]}
  - {name: Residential, <<: [*manual, *manual_exclude, *filter_Home], proxies: [RSD-Auto], icon: "https://raw.githubusercontent.com/aaANDkk/ClashConfig/main/icon/Home.png"}
  - {name: HKG-Auto, <<: [*auto, *auto_exclude, *filter_HK]}
  - {name: Hong Kong, <<: [*manual, *manual_exclude, *filter_HK], proxies: [HKG-Auto], icon: "https://raw.githubusercontent.com/aaANDkk/ClashConfig/main/icon/Hong_Kong.png"}
  - {name: TWN-Auto, <<: [*auto, *auto_exclude, *filter_TW]}
  - {name: Taiwan, <<: [*manual, *manual_exclude, *filter_TW], proxies: [TWN-Auto], icon: "https://raw.githubusercontent.com/aaANDkk/ClashConfig/main/icon/Taiwan.png"}
  - {name: JPN-Auto, <<: [*auto, *auto_exclude, *filter_JP]}
  - {name: Japan, <<: [*manual, *manual_exclude, *filter_JP], proxies: [JPN-Auto], icon: "https://raw.githubusercontent.com/aaANDkk/ClashConfig/main/icon/Japan.png"}
  - {name: SGP-Auto, <<: [*auto, *auto_exclude, *filter_SG]}
  - {name: Singapore, <<: [*manual, *manual_exclude, *filter_SG], proxies: [SGP-Auto], icon: "https://raw.githubusercontent.com/aaANDkk/ClashConfig/main/icon/Singapore.png"}
  - {name: USA-Auto, <<: [*auto, *auto_exclude, *filter_US]}
  - {name: United States, <<: [*manual, *manual_exclude, *filter_US], proxies: [USA-Auto], icon: "https://raw.githubusercontent.com/aaANDkk/ClashConfig/main/icon/United_States.png"}
  - {name: OTR-Auto, <<: [*auto, *auto_exclude, *filter_Others]}
  - {name: Other Regions, <<: [*manual, *manual_exclude, *filter_Others], proxies: [OTR-Auto], icon: "https://raw.githubusercontent.com/aaANDkk/ClashConfig/main/icon/Global.png"}

# ─── 🧭 策略分组区域 FINAL ───

# ─── 📦 规则集合区域 START ───

